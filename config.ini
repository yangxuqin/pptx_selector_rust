; ============================================================
;  PPTX 智能打开器 - 配置文件
;  将本文件与 pptx_selector.exe 放在同一目录下即可生效
;  修改后无需重新编译，重启程序即可读取新配置
; ============================================================

[Paths]
; Microsoft PowerPoint 可执行文件完整路径
PowerPoint=C:\Program Files\Microsoft Office\root\Office16\POWERPNT.EXE

; WPS 演示可执行文件完整路径（注意区分 32 位和 64 位安装路径）
; 32 位 WPS 示例：C:\Program Files (x86)\Kingsoft\WPS Office\12.1.0.23542\office6\wpp.exe
; 64 位 WPS 示例：C:\Program Files\Kingsoft\WPS Office\12.1.0.23542\office6\wpp.exe
WPS=C:\Program Files\Kingsoft\WPS Office\12.1.0.23542\office6\wpp.exe

; 日志文件路径（程序会自动创建目录）
LogFile=D:\logs\pptx_selector.log

[Options]
; 是否启用日志：1=启用  0=禁用
EnableLog=1

; 无法识别创建软件时的兜底程序：0=用WPS打开  1=用PowerPoint打开
Fallback=0
